name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: No symlinks packaged
        run: test -z "$(find . -name .git -prune -o -type l -print -quit)"

      - name: Install test dependencies
        run: |
          pip install pytest
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools qml6-module-qttest \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml \
            qml6-module-qtqml-workerscript

      - name: Run tests
        run: pytest -q tests/

      - name: Generator smoke test
        run: |
          python3 cursorgen.py apply --style lich --color '#6b8a69' \
            --out /tmp/icons --no-apply --no-save
          test -f /tmp/icons/OmCursorForge/cursors/default
          test -f /tmp/icons/OmCursorForge/index.theme
